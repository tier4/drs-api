# Module Agent Configuration

# Server settings
server:
  port: 50051

# API enable/disable settings
apis:
  enable_reboot: true           # Enable/disable reboot API
  enable_shutdown: true         # Enable/disable shutdown API
  enable_service_management: true  # Enable/disable service management APIs
  enable_disk_usage: true       # Enable/disable disk usage API
  enable_ptp_check: true        # Enable/disable PTP check API

# Disk monitoring settings
disk:
  # Directories to monitor for disk usage
  monitored_paths:
    - path: "/"
      name: "root"
      description: "Root filesystem"
    - path: "/home"
      name: "home"
      description: "Home directory"
    - path: "/var/log"
      name: "logs"
      description: "Log directory"
    - path: "/tmp"
      name: "temp"
      description: "Temporary files"
  
  # Default path when no specific path is requested
  default_path: "/"

# Service management settings (only applies in full mode)
services:
  enable_systemd_manage: true
  allowed_services:
    - "drs.service"
    - "recorder.service"

# System operation settings
system:
  # Maximum delay allowed for reboot/shutdown (seconds)
  max_delay_seconds: 300
  
  # Enable system operations
  allow_reboot: true
  allow_shutdown: true

# PTP time synchronization settings
ptp:
  # Remote devices to check for PTP sync
  remote_devices:
    - name: "front_lidar"
      ip_address: "192.168.2.201"
    - name: "rear_lidar"
      ip_address: "192.168.2.202"
  
  # PTP sync threshold in nanoseconds (default: 1ms)
  sync_threshold_ns: 1000000

# Example configurations for different modules:
#
# For Sensing Module:
# apis:
#   enable_reboot: true
#   enable_shutdown: true
#   enable_service_management: true  # For managing recording services
#   enable_disk_usage: true          # For monitoring storage
#   enable_ptp_check: true           # For time synchronization
#
# For Storage Module:
# apis:
