# DRS API Module Agent Configuration Example
# Copy this file to config.yaml and modify as needed

server:
  port: 50051

# Disk monitoring configuration  
# Single disk per ECU - API users don't need to know disk details
disk:
  enabled: true                  # Enable disk usage API
  monitor_path: "/mnt/ssd/data"  # Path to monitor for disk usage

# Service management configuration
services:
  enabled: true                  # Enable service management API
  services:
    drs_sensor:
      systemd_name: "drs_sensor.service"
      description: "Data recording sensor management service"
    drs_recorder:
      systemd_name: "drs_recorder.service"
      description: "Data recording service"

# System operation configuration
system:
  enable_reboot: true            # Enable reboot API
  enable_shutdown: true          # Enable shutdown API
  max_delay_seconds: 300
  allow_reboot: true
  allow_shutdown: true

# PTP synchronization monitoring
ptp:
  enabled: true                  # Enable PTP check API
  sync_threshold_ns: 1000000     # 1ms
  remote_devices:
    - name: "front_lidar"
      ip_address: "192.168.2.201"
    - name: "left_lidar"
      ip_address: "192.168.2.203"
