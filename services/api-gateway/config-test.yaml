# API Gateway Configuration

server:
  host: "0.0.0.0"
  port: 8081
  read_timeout: 30s
  write_timeout: 30s

# ECU service definitions
ecus:
  ecu0:
    address: "192.168.20.1:50051"
    enabled_services:
      - "system"
      - "ptp" 
      - "services"
      - "disk"
    has_ros2_bridge: true
    ros2_bridge_address: "192.168.20.1:50052"
    
  ecu1:
    address: "192.168.20.2:50051"
    enabled_services:
      - "system"
      - "ptp"
      - "services" 
      - "disk"
    has_ros2_bridge: false
    
  nas:
    address: "192.168.10.100:50051"
    enabled_services:
      - "system"
      - "disk"  # NAS only enables system and disk monitoring
    has_ros2_bridge: false

# gRPC client settings
grpc:
  timeout: 10s
  max_retry: 3
  
# CORS settings for web dashboard
cors:
  allowed_origins:
    - "http://localhost:3000"  # React dev server
    - "http://192.168.20.10:3000"  # Production dashboard
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
  allowed_headers:
    - "Content-Type"
    - "Authorization"