set noparent
linelength=100
root=services/ros2-bridge/include
# Filters disabled to match the project's ament/ROS2 clang-format style
# (Allman braces, AccessModifierOffset: -2, custom include ordering).
filter=-legal/copyright,-build/c++11,-runtime/references,-whitespace/braces,-whitespace/indent,-build/include_order
# Generated protobuf/gRPC sources should not be linted.
exclude_files=.*\.pb\.h$
exclude_files=.*\.pb\.cc$
exclude_files=.*\.grpc\.pb\.h$
exclude_files=.*\.grpc\.pb\.cc$
