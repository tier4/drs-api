repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-xml
      - id: detect-private-key
      - id: mixed-line-ending
      - id: check-merge-conflict

  # Go Services Lint
  # Note: pre-commit provisions golangci-lint in its own Go env via `language: golang`.
  # No local ./bin/golangci-lint is required; first run installs it under ~/.cache/pre-commit/.
  - repo: local
    hooks:
      - id: golangci-lint-api-gateway
        name: golangci-lint (api-gateway)
        entry: bash -c "cd services/api-gateway && golangci-lint run ./..."
        language: golang
        additional_dependencies:
          - github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2
        files: ^services/api-gateway/
        pass_filenames: false
      - id: golangci-lint-module-manager
        name: golangci-lint (module-manager)
        entry: bash -c "cd services/module-manager && golangci-lint run ./..."
        language: golang
        additional_dependencies:
          - github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2
        files: ^services/module-manager/
        pass_filenames: false

  # UI Dashboard Lint & Format
  # Running via local pnpm to ensure all project-specific dependencies/plugins from flat config are available
  - repo: local
    hooks:
      - id: dashboard-lint
        name: dashboard eslint
        entry: bash -c 'if ! command -v pnpm >/dev/null 2>&1; then echo "[error] Install pnpm to run this hook"; exit 1; fi; cd ui/dashboard && { [ -x node_modules/.bin/eslint ] || pnpm install --frozen-lockfile --prefer-offline; } && pnpm run lint'
        language: system
        files: ^ui/dashboard/.*\.(jsx?|tsx?|mjs|cjs)$
        pass_filenames: false
      - id: dashboard-format
        name: dashboard prettier
        entry: bash -c 'if ! command -v pnpm >/dev/null 2>&1; then echo "[error] Install pnpm to run this hook"; exit 1; fi; cd ui/dashboard && { [ -x node_modules/.bin/prettier ] || pnpm install --frozen-lockfile --prefer-offline; } && pnpm run format:check'
        language: system
        files: ^ui/dashboard/src/.*\.(jsx?|tsx?|json|css|md)$
        pass_filenames: false

  # Protobuf Lint
  - repo: https://github.com/bufbuild/buf
    rev: v1.39.0
    hooks:
      - id: buf-lint
        name: buf lint
        args: [proto]

  # Dockerfile Lint
  # Uses AleksaC/hadolint-py which bundles the hadolint binary so no local install is required.
  # Config is auto-discovered from .hadolint.yaml at the repo root.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.14.0
    hooks:
      - id: hadolint
        name: hadolint

  # C++ Format
  # Uses pre-commit/mirrors-clang-format which ships the binary via npm, so no local install is required.
  # Style is auto-discovered from .clang-format at the repo root.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        name: clang-format
        files: ^services/ros2-bridge/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        # Skip ROS2 build artifacts (build/, install/, log/) which may exist under
        # services/ros2-bridge/ when colcon builds in-tree.
        exclude: ^services/ros2-bridge/(build|install|log)/

  # C++ Lint
  # Uses cpplint/cpplint which ships via PyPI, so no local install is required.
  # Config is auto-discovered from CPPLINT.cfg at the repo root.
  - repo: https://github.com/cpplint/cpplint
    rev: 2.0.2
    hooks:
      - id: cpplint
        name: cpplint
        types_or: [c++, c, cuda]
        args: [--quiet]
        files: ^services/ros2-bridge/(src|include)/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        # Skip ROS2 build artifacts (build/, install/, log/) which may exist under
        # services/ros2-bridge/ when colcon builds in-tree.
        exclude: ^services/ros2-bridge/(build|install|log)/

  # C++ Static Analysis
  # cppcheck is invoked from the locally installed binary (Ubuntu/Debian:
  # `sudo apt-get install -y cppcheck`). Suppressions are pulled from
  # .cppcheck_suppressions at the repo root.
  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck
        entry: bash -c 'if ! command -v cppcheck >/dev/null 2>&1; then echo "[error] Install cppcheck to run this hook"; exit 1; fi; cd services/ros2-bridge && cppcheck --enable=all --inline-suppr --suppressions-list=../../.cppcheck_suppressions --std=c++17 --error-exitcode=1 --quiet -I include src include'
        language: system
        types_or: [c++, c, cuda]
        files: ^services/ros2-bridge/(src|include)/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        # Skip ROS2 build artifacts (build/, install/, log/) which may exist under
        # services/ros2-bridge/ when colcon builds in-tree.
        exclude: ^services/ros2-bridge/(build|install|log)/
        pass_filenames: false

  # Markdown Lint
  # Uses igorshubovych/markdownlint-cli which ships the binary via npm, so no local install is required.
  # Config is auto-discovered from .markdownlint.yaml at the repo root.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        name: markdownlint
        args: [-c, .markdownlint.yaml, --fix]

  # YAML Lint
  # Uses adrienverge/yamllint which ships via PyPI, so no local install is required.
  # Config is auto-discovered from .yamllint.yaml at the repo root.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        name: yamllint

  # Shell Script Lint
  # Uses shellcheck-py which bundles the shellcheck binary, so no local install is required.
  # Config is auto-discovered from .shellcheckrc at the repo root.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.7.0-1
    hooks:
      - id: shfmt
        name: shfmt
        args: [-w, -s, -i=4]
