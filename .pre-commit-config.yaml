repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.*/)?gen/.*$
      - id: end-of-file-fixer
        exclude: ^(.*/)?gen/.*$
      - id: check-yaml
      - id: check-added-large-files

  # Go Services Lint
  # Note: pre-commit provisions golangci-lint in its own Go env via `language: golang`.
  # No local ./bin/golangci-lint is required; first run installs it under ~/.cache/pre-commit/.
  - repo: local
    hooks:
      - id: golangci-lint-api-gateway
        name: golangci-lint (api-gateway)
        entry: bash -c "cd services/api-gateway && golangci-lint run ./..."
        language: golang
        additional_dependencies:
          - github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2
        files: ^services/api-gateway/
        pass_filenames: false
      - id: golangci-lint-module-manager
        name: golangci-lint (module-manager)
        entry: bash -c "cd services/module-manager && golangci-lint run ./..."
        language: golang
        additional_dependencies:
          - github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2
        files: ^services/module-manager/
        pass_filenames: false

  # UI Dashboard Lint & Format
  # Running via local pnpm to ensure all project-specific dependencies/plugins from flat config are available
  - repo: local
    hooks:
      - id: dashboard-lint
        name: dashboard eslint
        entry: bash -c 'if ! command -v pnpm >/dev/null 2>&1; then echo "[error] Install pnpm to run this hook"; exit 1; fi; cd ui/dashboard && pnpm run lint'
        language: system
        files: ^ui/dashboard/
        pass_filenames: false
      - id: dashboard-format
        name: dashboard prettier
        entry: bash -c 'if ! command -v pnpm >/dev/null 2>&1; then echo "[error] Install pnpm to run this hook"; exit 1; fi; cd ui/dashboard && pnpm run format:check'
        language: system
        files: ^ui/dashboard/
        pass_filenames: false

  # Protobuf Lint
  - repo: https://github.com/bufbuild/buf
    rev: v1.39.0
    hooks:
      - id: buf-lint
        name: buf lint
        args: ["proto"]

  # Dockerfile Lint
  # Uses AleksaC/hadolint-py which bundles the hadolint binary so no local install is required.
  # Config is auto-discovered from .hadolint.yaml at the repo root.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.14.0
    hooks:
      - id: hadolint
        name: hadolint

  # C++ Format
  # Uses pre-commit/mirrors-clang-format which ships the binary via npm, so no local install is required.
  # Style is auto-discovered from .clang-format at the repo root.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        name: clang-format
        files: ^services/ros2-bridge/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$

  # Markdown Lint
  # Uses igorshubovych/markdownlint-cli which ships the binary via npm, so no local install is required.
  # Config is auto-discovered from .markdownlint.yaml at the repo root.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        name: markdownlint
