name: Protocol Buffers CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'proto/**'
      - 'scripts/generate-proto.sh'
      - '.github/workflows/proto.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'proto/**'
      - 'scripts/generate-proto.sh'
      - '.github/workflows/proto.yml'

jobs:
  validate:
    name: Validate Protocol Buffers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create buf.yaml if not exists
        run: |
          if [ ! -f proto/buf.yaml ]; then
            cat > proto/buf.yaml << 'EOF'
          version: v1
          breaking:
            use:
              - FILE
          lint:
            use:
              - DEFAULT
          EOF
          fi

      - name: Buf lint
        working-directory: proto
        run: buf lint
        continue-on-error: true

      - name: Buf breaking change detection
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"
        continue-on-error: true

  generate:
    name: Test Proto Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate Go code
        run: |
          chmod +x scripts/generate-proto.sh
          ./scripts/generate-proto.sh --go-only

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || {
            echo "Generated proto files have uncommitted changes"
            echo "Please run './scripts/generate-proto.sh --go-only' and commit the changes"
            exit 1
          }
