name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  packages: write

jobs:
  release-docker-build:
    name: Build Docker Image (${{ matrix.image }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pkg-drs-api-gateway
            dockerfile: docker/api-gateway/Dockerfile
            platform: linux/amd64
          - image: pkg-drs-api-gateway
            dockerfile: docker/api-gateway/Dockerfile
            platform: linux/arm64
          - image: pkg-drs-dashboard
            dockerfile: docker/dashboard/Dockerfile
            platform: linux/amd64
          - image: pkg-drs-dashboard
            dockerfile: docker/dashboard/Dockerfile
            platform: linux/arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare cache scope slug
        id: slug
        run: echo "value=$(echo '${{ matrix.image }}-${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.slug.outputs.value }}
          cache-to: type=gha,mode=max,scope=${{ steps.slug.outputs.value }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.image }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.image }}/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.slug.outputs.value }}
          path: /tmp/digests/${{ matrix.image }}/*
          if-no-files-found: error
          retention-days: 1

  release-docker-manifest:
    name: Merge Manifests (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [release-docker-build]
    strategy:
      matrix:
        image: [pkg-drs-api-gateway, pkg-drs-dashboard]
    steps:
      - name: Download all digests for ${{ matrix.image }}
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/${{ matrix.image }}
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create and push manifest
        working-directory: /tmp/digests/${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}

  release-binaries:
    name: Build & Publish Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build api-gateway binaries
        working-directory: services/api-gateway
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -ldflags '-w -s -extldflags "-static"' -o bin/api-gateway-amd64-static cmd/server/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -a -ldflags '-w -s -extldflags "-static"' -o bin/api-gateway-arm64-static cmd/server/main.go

      - name: Build module-manager binaries
        working-directory: services/module-manager
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -ldflags '-w -s -extldflags "-static"' -o bin/module-manager-amd64-static cmd/server/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -a -ldflags '-w -s -extldflags "-static"' -o bin/module-manager-arm64-static cmd/server/main.go

      - name: Build drs-cli binaries
        working-directory: tools/drs-cli
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -ldflags '-w -s -extldflags "-static"' -o bin/drs-cli-amd64-static .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -a -ldflags '-w -s -extldflags "-static"' -o bin/drs-cli-arm64-static .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            services/api-gateway/bin/api-gateway-amd64-static
            services/api-gateway/bin/api-gateway-arm64-static
            services/module-manager/bin/module-manager-amd64-static
            services/module-manager/bin/module-manager-arm64-static
            tools/drs-cli/bin/drs-cli-amd64-static
            tools/drs-cli/bin/drs-cli-arm64-static
