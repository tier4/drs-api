syntax = "proto3";

package drs.ros2bridge.v1;

import "drs/ros2bridge/v1/common.proto";

option go_package = "./gen/drs/ros2bridge/v1;ros2bridgev1";

service SensingService {
  // Standard methods
  rpc GetPosition(GetPositionRequest) returns (GetPositionResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // Custom method for camera preview
  rpc GetCameraPreview(GetCameraPreviewRequest) returns (GetCameraPreviewResponse);

  // Custom method for LiDAR point cloud preview
  rpc GetPointCloudPreview(GetPointCloudPreviewRequest) returns (GetPointCloudPreviewResponse);
}

// Standard Get operation for position
message GetPositionRequest {
  // Empty - always returns current position
}

message GetPositionResponse {
  // Keep position at field 1 (its number prior to this change) to preserve
  // wire compatibility with any client/server built against the old schema.
  Position position = 1;
  bool has_data = 2;  // False if no nav_sat_fix message has been received yet, or it is stale
}

// Custom method to fetch a resized preview frame from a camera topic
message GetCameraPreviewRequest {
  // Full topic name, e.g. "/sensing/camera/camera0/image_raw/compressed".
  // The bridge lazily subscribes to this topic on first request.
  string topic_name = 1;
}

message GetCameraPreviewResponse {
  bool has_data = 1;       // False if no frame has been received yet for this topic
  string content_type = 2; // e.g. "image/jpeg"
  bytes image_data = 3;    // Resized (720p) JPEG-encoded frame bytes
}

// Custom method to fetch a decimated preview frame from a LiDAR "_points"
// topic, derived from the requested "_packets" topic name.
message GetPointCloudPreviewRequest {
  // Full "_packets" topic name, e.g. "/sensing/lidar/front/seyond_packets".
  // The bridge derives the decoded "_points" topic and lazily subscribes.
  string topic_name = 1;
  // Max points to return after decimation. Missing/zero/negative falls
  // back to the server default (5000); always clamped to a 5000 ceiling
  // regardless of what the client requests.
  int32 max_points = 2;
}

message GetPointCloudPreviewResponse {
  bool has_data = 1;         // False if no frame has been received yet on the derived topic
  bool decoder_running = 2;  // True if a publisher exists on the derived "_points" topic
  string content_type = 3;   // "application/octet-stream"
  // Interleaved little-endian Float32Array, fixed 16 bytes/point:
  // (x, y, z, intensity). intensity is 0.0 when no intensity-like field
  // exists on the source PointCloud2, so the wire format never branches
  // on field presence.
  bytes point_data = 4;
}

// Standard List operation for nodes
message ListNodesRequest {
  // Filter by namespace: "namespace:=/sensing"
  string filter = 1;
}

message ListNodesResponse {
  repeated Node nodes = 1;
}
