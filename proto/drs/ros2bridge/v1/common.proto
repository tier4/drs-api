syntax = "proto3";

package drs.ros2bridge.v1;

import "google/protobuf/timestamp.proto";

option go_package = "./gen/drs/ros2bridge/v1;ros2bridgev1";

// Position resource - NavSatFix data
message Position {
  Header header = 1;                           // ROS2 header information
  NavSatStatus nav_sat_status = 2;             // Navigation satellite status
  double latitude = 3;                         // Latitude in degrees
  double longitude = 4;                        // Longitude in degrees  
  double altitude = 5;                         // Altitude in meters
  repeated double position_covariance = 6;     // 3x3 covariance matrix (row-major)
  uint32 position_covariance_type = 7;         // Covariance type
}

// ROS2 Header
message Header {
  google.protobuf.Timestamp stamp = 1;         // ROS2 timestamp
  string frame_id = 2;                         // Frame ID
}

// Navigation Satellite Status
message NavSatStatus {
  int32 status = 1;                            // STATUS_* constants from sensor_msgs
  int32 service = 2;                           // SERVICE_* constants from sensor_msgs
}

// Recording resource - recording session information  
message Recording {
  Header header = 1;                          // ROS2 header information
  string hardware_id = 2;                     // Hardware/machine identification
  bool is_recording = 3;                      // Recording status
  ErrorLevel error_level = 4;                 // Overall error level
  repeated TopicStatus topic_statuses = 5;    // Topic status monitoring
  
  enum ErrorLevel {
    ERROR_LEVEL_OK = 0;                       // No errors
    ERROR_LEVEL_WARN = 1;                     // Warning level
    ERROR_LEVEL_ERROR = 2;                    // Error level
  }
}

// Topic Status resource - per-topic recording status
message TopicStatus {
  string name = 1;                             // Resource name: topic_statuses/{topic_id}
  string topic_name = 2;                       // Actual ROS2 topic name
  string message_type = 3;                     // ROS2 message type
  double rate_hz = 4;                          // Current rate in Hz
  RateStatus rate_status = 5;                  // Rate status assessment
  
  enum RateStatus {
    RATE_STATUS_UNSPECIFIED = 0;
    RATE_STATUS_NORMAL = 1;                    // Normal rate
    RATE_STATUS_UNKNOWN = 2;                   // Unknown rate
    RATE_STATUS_TOO_LOW = 3;                   // Rate too low
    RATE_STATUS_TOO_HIGH = 4;                  // Rate too high  
    RATE_STATUS_NO_MESSAGES = 5;               // No messages
  }
}

// Node resource - ROS2 node information
message Node {
  string name = 1;                             // Node name with namespace
  string namespace = 2;                        // Node namespace
}