syntax = "proto3";

package system.v1;

option go_package = "github.com/proto_api/services/module-agent/gen/system/v1;systemv1";

service SystemService {
  // Standard methods
  rpc GetService(GetServiceRequest) returns (Service);
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  
  // Service management (custom methods)
  rpc StartService(StartServiceRequest) returns (StartServiceResponse);
  rpc StopService(StopServiceRequest) returns (StopServiceResponse);
  rpc RestartService(RestartServiceRequest) returns (RestartServiceResponse);
  rpc EnableService(EnableServiceRequest) returns (EnableServiceResponse);
  rpc DisableService(DisableServiceRequest) returns (DisableServiceResponse);
  
  // System operations (custom methods)
  rpc Reboot(RebootRequest) returns (RebootResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  
  // Resource state operations
  rpc GetDiskUsage(GetDiskUsageRequest) returns (GetDiskUsageResponse);
  rpc CheckPTPSync(CheckPTPSyncRequest) returns (CheckPTPSyncResponse);
}

message RebootRequest {
  int32 delay_seconds = 1;
}

message RebootResponse {
  bool success = 1;
  string message = 2;
}

message ShutdownRequest {
  int32 delay_seconds = 1;
}

message ShutdownResponse {
  bool success = 1;
  string message = 2;
}

// Standard Get operation
message GetServiceRequest {
  string name = 1; // Resource name: services/{service_id}
}

// Standard List operation
message ListServicesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
}

message ListServicesResponse {
  repeated Service services = 1;
  string next_page_token = 2;
}

// Service resource
message Service {
  string name = 1;          // Resource name: services/{service_id}
  string display_name = 2;  // Human-readable name
  ServiceState state = 3;   // Current state
  bool enabled = 4;         // Whether service is enabled
  string description = 5;   // Service description
  int64 uptime_seconds = 6; // Uptime in seconds
  
  enum ServiceState {
    SERVICE_STATE_UNSPECIFIED = 0;
    SERVICE_STATE_ACTIVE = 1;
    SERVICE_STATE_INACTIVE = 2;
    SERVICE_STATE_FAILED = 3;
    SERVICE_STATE_ACTIVATING = 4;
    SERVICE_STATE_DEACTIVATING = 5;
  }
}

// Service management operations
message StartServiceRequest {
  string name = 1; // Resource name: services/{service_id}
}

message StartServiceResponse {
  Service service = 1;
}

message StopServiceRequest {
  string name = 1; // Resource name: services/{service_id}
}

message StopServiceResponse {
  Service service = 1;
}

message RestartServiceRequest {
  string name = 1; // Resource name: services/{service_id}
}

message RestartServiceResponse {
  Service service = 1;
}

message EnableServiceRequest {
  string name = 1; // Resource name: services/{service_id}
}

message EnableServiceResponse {
  Service service = 1;
}

message DisableServiceRequest {
  string name = 1; // Resource name: services/{service_id}
}

message DisableServiceResponse {
  Service service = 1;
}

message GetDiskUsageRequest {
  string path = 1;
}

message GetDiskUsageResponse {
  bool success = 1;
  string message = 2;
  DiskUsage disk_usage = 3;
}

message DiskUsage {
  uint64 total_bytes = 1;
  uint64 used_bytes = 2;
  uint64 free_bytes = 3;
  double usage_percentage = 4;
  string filesystem = 5;
}

message CheckPTPSyncRequest {
  bool include_remote_devices = 1;
}

message CheckPTPSyncResponse {
  bool success = 1;
  string message = 2;
  PTPStatus local_status = 3;
  repeated RemotePTPStatus remote_statuses = 4;
}

message PTPStatus {
  string clock_id = 1;
  int64 master_offset_ns = 2;
  uint64 ingress_time = 3;
  bool gm_present = 4;
  string gm_identity = 5;
  bool is_synced = 6;
}

message RemotePTPStatus {
  string device_name = 1;
  string ip_address = 2;
  PTPStatus status = 3;
  bool is_reachable = 4;
  string error_message = 5;
}

